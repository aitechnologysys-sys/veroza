---
name: Build

on:
  # Upstream has a bare `push:` here, which matches EVERY branch. Combined with
  # `pull_request:` below, that builds the same commit twice as soon as a PR is
  # open — once for the push event, once for the pull_request event. Restricting
  # push to the default branch means: feature branches build once (via the PR),
  # main builds once (directly). Same coverage, half the runs.
  #
  # Divergence from upstream — expect a conflict here on `git merge upstream/main`
  # and keep our version. See docs/UPSTREAM-SYNC.md.
  push:
    branches: [main]
  merge_group:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    

    strategy:
      matrix:
        node-version: ['22.12.0']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

#      - name: Setup pnpm cache
#        uses: actions/cache@v4
#        with:
#          path: |
#            ${{ env.STORE_PATH }}
#            ${{ github.workspace }}/.next/cache
#          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
#          restore-keys: |
#            ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-

      # Runs before install so a banned provider fails in seconds, not minutes.
      # Guards against an upstream merge silently restoring a deliberately
      # removed connector — see scripts/check-banned-providers.mjs.
      - name: Check banned providers
        run: node scripts/check-banned-providers.mjs

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build
