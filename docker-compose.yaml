services:
  postiz:
    # Build OUR OWN image from this source tree instead of pulling the published
    # ghcr.io/gitroomhq/postiz-app image. This is exactly how the official image
    # is produced (see .github/workflows/build-containers.yml) — same Dockerfile,
    # same single NEXT_PUBLIC_VERSION build arg — so the result is behavior-identical.
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        # Only NEXT_PUBLIC_VERSION is baked at build time (used by a client
        # component). Defaults to the value in version.txt; override via
        # `NEXT_PUBLIC_VERSION=... docker compose build`.
        NEXT_PUBLIC_VERSION: ${NEXT_PUBLIC_VERSION:-v1.47.0}
    image: postiz-app:local
    pull_policy: never
    container_name: postiz
    restart: always

    # All secrets / API keys come from .env.prod (JWT, Cloudflare, social
    # keys, email, OpenAI, Polar, Stripe, etc.). Edit .env.prod, not this file.
    env_file:
      - .env.prod

    # Infra wiring that MUST point at compose service names / container paths.
    # `environment:` overrides `env_file`, so these win over the localhost-based
    # values in .env (which are correct for `pnpm dev` on the host, wrong here).
    environment:
      # === Public URLs ===
      # Default to localhost:4007 so running THIS prod compose locally just works
      # out of the box. NOTE the distinct POSTIZ_PUBLIC_* names: Compose reads the
      # repo `.env` for ${...} substitution, and `.env` already defines
      # FRONTEND_URL/NEXT_PUBLIC_BACKEND_URL with DEV ports (4200/3000) — using
      # those names here would leak the dev values into this prod stack.
      # On the server, set the real HTTPS domain in a `.env` file next to this
      # compose (Compose auto-reads `.env`), e.g.:
      #   POSTIZ_PUBLIC_URL=https://postiz.example.com
      # These are runtime-read, so changing them needs no rebuild — just
      # `docker compose -p postiz up -d postiz`. See docs/ORACLE-VM-DEPLOYMENT.md.
      MAIN_URL: ${POSTIZ_PUBLIC_URL:-http://localhost:4007}
      FRONTEND_URL: ${POSTIZ_PUBLIC_URL:-http://localhost:4007}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_PUBLIC_URL:-http://localhost:4007}/api
      BACKEND_INTERNAL_URL: 'http://localhost:3000'

      # === Service wiring (container network) ===
      DATABASE_URL: 'postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-prod'
      REDIS_URL: 'redis://postiz-redis:6379'
      TEMPORAL_ADDRESS: 'temporal:7233'

      # === Required flags ===
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'

      # === Storage (local disk; switch to Cloudflare R2 in .env if desired) ===
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'

    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      # Loopback-only: the host nginx (port 80/443) is the sole public listener.
      # Binding to 0.0.0.0 would expose the app directly (Docker bypasses ufw).
      - "127.0.0.1:4007:5000"
    networks:
      - postiz-network
      - temporal-network
    healthcheck:
      # node:bookworm-slim has no curl/wget; use Node 22's global fetch.
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-prod
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    # No host port: the app reaches Postgres over postiz-network. Publishing 5432
    # would expose the DB to the internet (Docker bypasses ufw) and clash with any
    # other Postgres on the host. For ad-hoc psql access, SSH-tunnel instead.
    networks:
      - postiz-network
    healthcheck:
      test: pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 3s
      retries: 3
  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

  # -----------------------
  # Temporal Stack
  # -----------------------
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    volumes:
      - temporal-es-volume:/var/lib/elasticsearch/data

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - temporal-postgres-volume:/var/lib/postgresql/data

  temporal:
    container_name: temporal
    restart: unless-stopped
    ports:
      - '127.0.0.1:7233:7233'
    image: temporalio/auto-setup:1.28.1
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    depends_on:
      - temporal
    tty: true

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - temporal-network
    ports:
      # Loopback-only: reach the dashboard via an SSH tunnel (see docs).
      - '127.0.0.1:8080:8080'

volumes:
  postgres-volume:
    external: false

  postiz-redis-data:
    external: false

  postiz-config:
    external: false

  postiz-uploads:
    external: false

  # Temporal's own data — named so workflow history survives container recreates.
  temporal-postgres-volume:
    external: false

  temporal-es-volume:
    external: false

networks:
  postiz-network:
    external: false
  temporal-network:
    driver: bridge
    name: temporal-network
