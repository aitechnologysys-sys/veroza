services:
  postaryx:
    # PULL our own image — never build here. Dockerfile.dev builds all three apps
    # inside the image with a 4 GB Node heap, which spikes this box to ~11.4 GB
    # against 12 GB and can OOM the running stack. The build happens in GitHub
    # Actions instead (.github/workflows/build-containers.yml, arm64) and this
    # host only pulls. See docs/CONTAINMENT-DEPLOYMENT-PLAN.md §6.
    #
    # Project name differs by machine: the server stack is `-p postaryx`, a local
    # prod rehearsal is `-p postaryx-prod` (keeps it isolated from `postaryx-dev`).
    # `docker compose ls` tells you which a box is using. Examples below use the
    # server's name; see README.md §2-3 for the full runbook.
    #
    # Deploy:   docker compose -p postaryx pull postaryx && docker compose -p postaryx up -d postaryx
    # Rollback: POSTARYX_IMAGE_TAG=<full-git-sha> docker compose -p postaryx pull postaryx
    #           POSTARYX_IMAGE_TAG=<full-git-sha> docker compose -p postaryx up -d postaryx
    #           (set it on BOTH — pull and up read it independently. Every build
    #            pushes a :<sha> tag, so old images stay pullable in GHCR.)
    #
    # The GHCR package is private by default, so both this VM and any machine
    # running this compose file need a one-time login with a read:packages token:
    #   echo "$GHCR_READ_ONLY_PAT" | docker login ghcr.io -u <github-username> --password-stdin
    #
    # To build locally instead (e.g. to test an unpushed change), don't edit this
    # file — override it. Needs ~4 GB free RAM; fine on a laptop, NEVER on the VM:
    #   docker build -f Dockerfile.dev --build-arg NEXT_PUBLIC_VERSION=local -t postaryx-app:local .
    #   POSTARYX_IMAGE=postaryx-app POSTARYX_IMAGE_TAG=local docker compose -p postaryx-prod up -d postaryx
    image: ${POSTARYX_IMAGE:-ghcr.io/aitechnologysys-sys/veroza}:${POSTARYX_IMAGE_TAG:-latest}
    container_name: postaryx
    restart: always

    # All secrets / API keys come from .env.prod (JWT, Cloudflare, social
    # keys, email, OpenAI, Polar, Stripe, etc.). Edit .env.prod, not this file.
    env_file:
      - .env.prod

    # Infra wiring that MUST point at compose service names / container paths.
    # `environment:` overrides `env_file`, so these win over the localhost-based
    # values in .env (which are correct for `pnpm dev` on the host, wrong here).
    environment:
      # === Public URLs ===
      # Default to localhost:4007 so running THIS prod compose locally just works
      # out of the box. NOTE the distinct POSTARYX_PUBLIC_* names: Compose reads the
      # repo `.env` for ${...} substitution, and `.env` already defines
      # FRONTEND_URL/NEXT_PUBLIC_BACKEND_URL with DEV ports (4200/3000) — using
      # those names here would leak the dev values into this prod stack.
      # On the server, set the real HTTPS domain in a `.env` file next to this
      # compose (Compose auto-reads `.env`), e.g.:
      #   POSTARYX_PUBLIC_URL=https://postaryx.example.com
      # These are runtime-read, so changing them needs no rebuild — just
      # `docker compose -p postaryx up -d postaryx`. See docs/ORACLE-VM-DEPLOYMENT.md.
      MAIN_URL: ${POSTARYX_PUBLIC_URL:-http://localhost:4007}
      FRONTEND_URL: ${POSTARYX_PUBLIC_URL:-http://localhost:4007}
      NEXT_PUBLIC_BACKEND_URL: ${POSTARYX_PUBLIC_URL:-http://localhost:4007}/api
      BACKEND_INTERNAL_URL: 'http://localhost:3000'

      # === Service wiring (container network) ===
      # DB user/password/name come from POSTARYX_DB_* in .env (next to this
      # compose file — NOT .env.prod, which Compose never reads for `${...}`
      # substitution). Single source of truth shared with the postaryx-postgres
      # service below, so they can't drift apart. See docs/1.SECURITY-HARDENING-TODO.md P0-2.
      DATABASE_URL: 'postgresql://${POSTARYX_DB_USER:?set POSTARYX_DB_USER in .env}:${POSTARYX_DB_PASSWORD:?set POSTARYX_DB_PASSWORD in .env}@postaryx-postgres:5432/${POSTARYX_DB_NAME:-postaryx-db-prod}'
      # Password from .env, matching postaryx-redis's `--requirepass` below —
      # see docs/1.SECURITY-HARDENING-TODO.md P1-3.
      REDIS_URL: 'redis://:${POSTARYX_REDIS_PASSWORD:?set POSTARYX_REDIS_PASSWORD in .env}@postaryx-redis:6379'
      TEMPORAL_ADDRESS: 'temporal:7233'

      # === Required flags ===
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'

      # === Storage ===
      # This hardcoded value wins over STORAGE_PROVIDER in .env.prod (environment:
      # overrides env_file) — change it here, not there, to switch providers.
      # UPLOAD_DIRECTORY/NEXT_PUBLIC_UPLOAD_DIRECTORY are unused when STORAGE_PROVIDER
      # is "cloudflare" (CLOUDFLARE_* vars come from .env.prod, not overridden here).
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'

    volumes:
      - postaryx-config:/config/
      - postaryx-uploads:/uploads/
    ports:
      # Loopback-only: the host nginx (port 80/443) is the sole public listener.
      # Binding to 0.0.0.0 would expose the app directly (Docker bypasses ufw).
      - '127.0.0.1:4007:5000'
    networks:
      - postaryx-network
      - temporal-network
    healthcheck:
      # node:bookworm-slim has no curl/wget; use Node 22's global fetch.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postaryx-postgres:
        condition: service_healthy
      postaryx-redis:
        condition: service_healthy
      # Not optional: the backend requires Temporal at module-init time, so
      # starting without it produces a container that serves the frontend but
      # has a dead API. See the healthcheck on the `temporal` service.
      temporal:
        condition: service_healthy

  postaryx-postgres:
    image: postgres:17-alpine
    container_name: postaryx-postgres
    restart: always
    environment:
      # Sourced from .env (next to this compose file), not .env.prod — see the
      # comment on DATABASE_URL above. Compose refuses to start rather than
      # silently falling back to a weak default if these are unset.
      POSTGRES_PASSWORD: ${POSTARYX_DB_PASSWORD:?set POSTARYX_DB_PASSWORD in .env}
      POSTGRES_USER: ${POSTARYX_DB_USER:?set POSTARYX_DB_USER in .env}
      POSTGRES_DB: ${POSTARYX_DB_NAME:-postaryx-db-prod}
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    ports:
      # Loopback-ONLY, for DBeaver — see docs/1.SECURITY-HARDENING-TODO.md P1-2.
      # The leading 127.0.0.1 is the entire security control: it binds to the
      # VM's internal interface, unreachable from outside. Reach it through an
      # SSH tunnel — same approach as temporal-ui:8080. Never remove the
      # 127.0.0.1 prefix: Docker bypasses ufw, so a bare "5432:5432" publishes
      # the DB straight to the internet, guarded only by whatever's in .env.
      - '127.0.0.1:5432:5432'
    networks:
      - postaryx-network
    healthcheck:
      test: pg_isready -U ${POSTARYX_DB_USER:?set POSTARYX_DB_USER in .env} -d ${POSTARYX_DB_NAME:-postaryx-db-prod}
      interval: 10s
      timeout: 3s
      retries: 3
  postaryx-redis:
    image: redis:7.2
    container_name: postaryx-redis
    restart: always
    # Password + memory cap sourced from .env — see
    # docs/1.SECURITY-HARDENING-TODO.md P1-3. Without maxmemory, Redis grows
    # unbounded; allkeys-lru evicts the least-recently-used key once it hits
    # the cap rather than OOM-ing.
    command:
      - redis-server
      - --requirepass
      - ${POSTARYX_REDIS_PASSWORD:?set POSTARYX_REDIS_PASSWORD in .env}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: redis-cli -a ${POSTARYX_REDIS_PASSWORD:?set POSTARYX_REDIS_PASSWORD in .env} --no-auth-warning ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postaryx-redis-data:/data
    networks:
      - postaryx-network

  # -----------------------
  # Temporal Stack
  # -----------------------
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    volumes:
      - temporal-es-volume:/var/lib/elasticsearch/data

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    restart: unless-stopped
    environment:
      # Password from .env — see docs/1.SECURITY-HARDENING-TODO.md. Username
      # stays the literal "temporal": Temporal's own tooling/images assume it,
      # it's not a secret, just an account name. Must match `temporal`'s
      # POSTGRES_PWD below (same var, so they can't drift apart).
      POSTGRES_PASSWORD: ${POSTARYX_TEMPORAL_DB_PASSWORD:?set POSTARYX_TEMPORAL_DB_PASSWORD in .env}
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - temporal-postgres-volume:/var/lib/postgresql/data

  temporal:
    container_name: temporal
    restart: unless-stopped
    ports:
      - '127.0.0.1:7233:7233'
    image: temporalio/auto-setup:1.28.1
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${POSTARYX_TEMPORAL_DB_PASSWORD:?set POSTARYX_TEMPORAL_DB_PASSWORD in .env}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap
    # The backend opens its Temporal connection during Nest module init, BEFORE
    # app.listen(). If Temporal is not reachable it dies there with
    # `Name resolution failed for target dns:temporal:7233`, and pm2 does not
    # restart it (pm2 supervises the pnpm wrapper, which stays alive). The
    # frontend keeps serving, so the only symptom is nginx logging
    # `111: Connection refused` on every /api/* request. Observed twice.
    #
    # So `postaryx` must wait for Temporal to be READY, not merely started —
    # hence this healthcheck plus `condition: service_healthy` on postaryx.
    #
    # `namespace describe default` rather than `cluster health` on purpose: it
    # proves both that the frontend is serving AND that the `default` namespace
    # auto-setup creates actually exists, which is the namespace the backend
    # connects to. Address is the service name, not 127.0.0.1 — Temporal binds
    # the container interface, and loopback is refused (verified).
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'temporal operator namespace describe default --address temporal:7233 >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      # Cold start does schema setup + namespace creation; this is generous on
      # purpose so a slow first boot is not reported as failed.
      start_period: 120s

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    depends_on:
      - temporal
    tty: true

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - temporal-network
    ports:
      # Loopback-only: reach the dashboard via an SSH tunnel (see docs).
      - '127.0.0.1:8080:8080'

volumes:
  postgres-volume:
    external: false

  postaryx-redis-data:
    external: false

  postaryx-config:
    external: false

  postaryx-uploads:
    external: false

  # Temporal's own data — named so workflow history survives container recreates.
  temporal-postgres-volume:
    external: false

  temporal-es-volume:
    external: false

networks:
  postaryx-network:
    external: false
  temporal-network:
    driver: bridge
    name: temporal-network
